name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgis-contract:
    name: PostGIS migration and tile contracts
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:18-3.6-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mapa_contract_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mapa_contract_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Generate Prisma client
        run: bunx prisma generate --schema prisma/schema.prisma
      - name: Exercise the SQL and decoded MVT contract in a disposable database
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mapa_contract_test
        run: node tools/test-postgis-contract.mjs

  checks:
    name: Lint, test, and build
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate --schema prisma/schema.prisma

      - name: Lint projects
        run: bunx nx run-many -t lint --all --parallel=3

      - name: Run unit tests
        run: bunx nx run-many --target=test --all --parallel=3 --configuration=ci

      - name: Build deployable apps
        run: bunx nx run-many -t build -p backend,frontend --configuration=production --parallel=2

  dataset-handling:
    name: Rust dataset handling tests and lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component clippy

      - name: Run Rust tests
        working-directory: dataset-handling
        run: cargo test --locked

      - name: Run Rust Clippy
        working-directory: dataset-handling
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Build release converter
        working-directory: dataset-handling
        run: cargo build --locked --release

  python-importer:
    name: Python importer contract tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r apps/backend/src/assets/python/requirements.txt

      - name: Compile importer scripts
        run: python -m compileall -q apps/backend/src/assets/python

      - name: Run importer contract tests
        run: python -m unittest discover -s apps/backend/src/assets/python -p 'test_*.py'
